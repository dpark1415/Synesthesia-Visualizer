  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.05, octaves: 6, oscillator: { type: 'sine' },
    envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 1.0, attackCurve: 'exponential' }
  }).connect(masterComp);
  const snare = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.002, decay: 0.18, sustain: 0 }
  }).connect(masterComp);
  const hat = new Tone.MetalSynth({
    frequency: 250, envelope: { attack: 0.001, decay: 0.08, release: 0.02 },
    harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5
  }).connect(masterComp);
  hat.volume.value = -22;
  snare.volume.value = -12;
  player.synths.drums = { kick, snare, hat, _bus: masterComp };

  player.synths.bass = new Tone.MonoSynth({
    oscillator: { type: 'sawtooth' },
    filter: { Q: 1.4, type: 'lowpass', rolloff: -24 },
    envelope: { attack: 0.02, decay: 0.25, sustain: 0.55, release: 0.6 },
    filterEnvelope: { attack: 0.02, decay: 0.18, sustain: 0.5, release: 0.4, baseFrequency: 90, octaves: 3.2 }
  }).connect(masterComp);
  player.synths.bass.volume.value = -8;

  player.synths.melody = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'triangle' },
    envelope: { attack: 0.012, decay: 0.18, sustain: 0.5, release: 0.6 }
  }).connect(masterComp);
  player.synths.melody.volume.value = -12;

  player.synths.pads = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sine' },
    envelope: { attack: 0.6, decay: 1.5, sustain: 0.7, release: 2.0 }
  }).connect(masterComp);
  player.synths.pads.volume.value = -16;

  player.synths.lead = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: 'sawtooth' },
    envelope: { attack: 0.005, decay: 0.18, sustain: 0.55, release: 0.5 }
  }).connect(masterComp);
  player.synths.lead.volume.value = -14;
}

function fireVisual(role, note) {
  const v = note.velocity ?? 0.8;
  const m = note.midi;
  if (role === 'drums') {
    const kind = classifyDrumNote(m);
    if (kind === 'kick')  drums.triggerKick(v);
    if (kind === 'snare') drums.triggerSnare(v);
    if (kind === 'hat')   drums.triggerHat(v);
  } else if (role === 'bass')   { bass.trigger(v, m); }
  else if (role === 'melody') { melody.trigger(v, m); }
  else if (role === 'pads')   { pads.trigger(v); }
  else if (role === 'lead')   { lead.trigger(v, m); }
}

function playSound(role, note, time) {
  const dur = Math.max(0.02, note.duration);
  const v = note.velocity ?? 0.8;
  const s = player.synths[role];
  if (!s) return;
  if (role === 'drums') {
    const kind = classifyDrumNote(note.midi);
    if (kind === 'kick')  s.kick.triggerAttackRelease('C1', '8n', time, v);
    if (kind === 'snare') s.snare.triggerAttackRelease('16n', time, v);
    if (kind === 'hat')   s.hat.triggerAttackRelease('32n', time, v * 0.7);
  } else if (role === 'bass') {
    s.triggerAttackRelease(note.name, dur, time, v);
  } else {
    s.triggerAttackRelease(note.name, dur, time, v);
  }
}

async function loadMidiFromArrayBuffer(buf) {
  const midi = new Midi(buf);
  player.midi = midi;
  disposePlayer();
  buildSynths();

  // route tracks
  const routed = [];
  midi.tracks.forEach((tr, i) => {
    if (!tr.notes || !tr.notes.length) return;
    const role = classifyTrack(tr, i, midi.tracks.length);
    routed.push({ track: tr, role });
  });
  player.routedTracks = routed;
  player.duration = midi.duration;

  // build a Part per track that triggers both visual + sound
  for (const { track, role } of routed) {
    const events = track.notes.map(n => [n.time, n]);
    const part = new Tone.Part((time, note) => {
      // visual triggers run on the AudioContext clock; schedule the visual
      // callback via Tone.Draw so it lands close to the correct frame
      Tone.Draw.schedule(() => fireVisual(role, note), time);
      playSound(role, note, time);
      // For sustained roles, push the envelope's sustain target during the note
      if (role === 'bass') {
        Tone.Draw.schedule(() => bass.setSustain(0.4 + (note.velocity || 0.6) * 0.5), time);
        Tone.Draw.schedule(() => bass.setSustain(0), time + Math.max(0.05, note.duration) * 0.95);
      }
      if (role === 'pads') {
        Tone.Draw.schedule(() => pads.setSustain(0.3 + (note.velocity || 0.6) * 0.5), time);
        Tone.Draw.schedule(() => pads.setSustain(0), time + Math.max(0.05, note.duration) * 0.95);
      }
    }, events);
    part.start(0);
    player.parts.push(part);
  }

  // populate legend with note counts
  const counts = { drums: 0, bass: 0, melody: 0, pads: 0, lead: 0 };
  for (const { track, role } of routed) counts[role] += track.notes.length;
  for (const role of Object.keys(counts)) {
    const el = document.querySelector(`[data-track="${role}"]`);
    if (el) el.textContent = counts[role] ? `${counts[role]} notes` : '—';
  }

  player.state = 'ready';
  player.pausedOffset = 0;
  setTransportVisible(true);
  showToast(`${midi.name || 'Loaded'} · ${routed.length} tracks · ${formatTime(midi.duration)}`);
}

async function startPlayback() {
  if (player.state === 'idle') return;
  await Tone.start();
  if (player.state === 'paused') {
    Tone.Transport.start();
  } else {
    Tone.Transport.stop();
    Tone.Transport.position = 0;
    Tone.Transport.start();
  }
  player.state = 'playing';
  updatePlayIcon();
}

function pausePlayback() {
  if (player.state !== 'playing') return;
  Tone.Transport.pause();
  player.state = 'paused';
  updatePlayIcon();
}

function stopPlayback() {
  if (player.state === 'idle') return;
  Tone.Transport.stop();
  Tone.Transport.position = 0;
  player.state = 'ready';
  player.pausedOffset = 0;
  updatePlayIcon();
}

function seekTo(seconds) {
  if (player.state === 'idle') return;
  const wasPlaying = player.state === 'playing';
  Tone.Transport.seconds = seconds;
  if (wasPlaying) {
    // restart parts at new position
    Tone.Transport.start();
  }
}

function showToast(msg, kind = 'ok') {
  ui.toast.textContent = msg;
  ui.toast.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => ui.toast.classList.remove('show'), 2400);
}

function setTransportVisible(on) {
  ui.transport.classList.toggle('show', on);
  ui.legend.classList.toggle('show', on);
  if (on) ui.hint.style.opacity = '0';
}

function formatTime(sec) {
  if (!isFinite(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

const ICON_PLAY  = '<path d="M4 3l9 5-9 5V3z"/>';
const ICON_PAUSE = '<path d="M4 3h3v10H4zM9 3h3v10H9z"/>';
function updatePlayIcon() {
  ui.icPlay.innerHTML = (player.state === 'playing') ? ICON_PAUSE : ICON_PLAY;
}

// drag and drop ------------------------------------------------------------
let dragDepth = 0;
function showDrop(on) {
  ui.drop.classList.toggle('show', on);
  ui.drop.classList.toggle('armed', on);
}
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  showDrop(true);
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth = Math.max(0, dragDepth - 1);
  if (dragDepth === 0) showDrop(false);
});
window.addEventListener('dragover', e => { e.preventDefault(); });
window.addEventListener('drop', async e => {
  e.preventDefault();
  dragDepth = 0;
  showDrop(false);
  const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!file) return;
  if (!/\.midi?$/i.test(file.name)) {
    showToast('Please drop a .mid file');
    return;
  }
  try {
    const buf = await file.arrayBuffer();
    await loadMidiFromArrayBuffer(buf);
  } catch (err) {
    console.error(err);
    showToast('Could not parse MIDI');
  }
});

// click drop ring to open picker; same for "O" key
ui.drop.addEventListener('click', () => ui.picker.click());
window.addEventListener('keydown', e => {
  if (e.key === 'o' || e.key === 'O') ui.picker.click();
  if (e.key === ' ') {
    e.preventDefault();
    if (player.state === 'playing') pausePlayback();
    else if (player.state === 'paused' || player.state === 'ready') startPlayback();
  }
});
ui.picker.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const buf = await f.arrayBuffer();
  try { await loadMidiFromArrayBuffer(buf); }
  catch (err) { console.error(err); showToast('Could not parse MIDI'); }
});

ui.btnPlay.addEventListener('click', () => {
  if (player.state === 'playing') pausePlayback();
  else startPlayback();
});
ui.btnStop.addEventListener('click', stopPlayback);
ui.seek.addEventListener('input', () => {
  const dur = player.duration || 1;
  const t = (parseFloat(ui.seek.value) / 1000) * dur;
  seekTo(t);
});

// ---- animation loop ------------------------------------------------------
const clock = new THREE.Clock();
let elapsed = 0;
function tick() {
  const dt = Math.min(0.1, clock.getDelta());
  elapsed += dt;

  // gentle idle ambience so the scene breathes even without MIDI:
  // pads shimmer slowly, bass sways. We bias their envelopes upward by a
  // slow LFO so the visuals don't sit dead at zero.
  const idleA = 0.18 + 0.10 * Math.sin(elapsed * 0.27);     // 0.08..0.28
  const idleB = 0.12 + 0.08 * Math.sin(elapsed * 0.41 + 1); // 0.04..0.20
  if (player.state !== 'playing') {
    pads.setSustain(idleA);
    bass.setSustain(idleB * 0.5);
  }

  // update each visual; collect activity totals for camera drift
  const drumE = drums.update(dt, elapsed);
  const bassE = bass.update(dt, elapsed);
  const melE  = melody.update(dt, elapsed);
  const padE  = pads.update(dt, elapsed);
  const leadE = lead.update(dt, elapsed);
  const energy = clamp01(drumE.kick * 0.7 + drumE.snare * 0.3 + bassE * 0.6 + melE * 0.4 + padE * 0.4 + leadE * 0.5);

  starField.mat.uniforms.uTime.value = elapsed;
  cameraDrift.update(elapsed, energy);

  // bloom strength breathes very subtly with energy so big moments feel bigger
  bloom.strength = 1.05 + energy * 0.55;

  // transport UI
  if (player.state === 'playing' || player.state === 'paused') {
    const t = Tone.Transport.seconds;
    if (player.state === 'playing' && t >= player.duration) {
      stopPlayback();
    }
    ui.time.textContent = `${formatTime(t)} / ${formatTime(player.duration)}`;
    const pct = clamp01(t / Math.max(0.001, player.duration));
    ui.seek.value = String(Math.round(pct * 1000));
    ui.seek.style.setProperty('--seek', (pct * 100).toFixed(2) + '%');
  }

  composer.render(dt);
  requestAnimationFrame(tick);
}

// initial overlay state: show the drop ring softly until a MIDI is loaded
ui.drop.classList.add('show');
requestAnimationFrame(tick);

</script>
</body>
</html>
